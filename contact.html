      <!--==================== HEADER ====================-->

                  <i class="ri-menu-line"></i>

            </div>

      <!--==================== MAIN ====================-->
      <main class="main page-main">
         <!--==================== CONTACT ====================-->
         <section class="contact section">
            <!-- <h1 class="section__title">
               Let's Talk<br>
               About You              
            </h1> -->
            <h1 class="section__title page__title">
               Let's Connect
            </h1>

            <div class="contact__page container grid">
               <form action="" class="contact__form grid" id="contact-form">
                  <p class="contact__required">Fields marked <span aria-hidden="true">*</span> are required.</p>

                  <div class="contact__group grid">
                     <div class="contact__box">
                        <input type="text" name="user_first_name" id="first-name" required placeholder="Your first name" class="contact__input">
                        <label for="first-name" class="contact__label">First Name <span class="contact__required-mark" aria-hidden="true">*</span></label>
                     </div>

                     <div class="contact__box">
                        <input type="text" name="user_last_name" id="last-name" required placeholder="Your last name" class="contact__input">
                        <label for="last-name" class="contact__label">Last Name <span class="contact__required-mark" aria-hidden="true">*</span></label>
                     </div>

                     <div class="contact__box">
                        <input type="email" name="user_email" id="email" required placeholder="you@example.com" class="contact__input">
                        <label for="email" class="contact__label">Email Address <span class="contact__required-mark" aria-hidden="true">*</span></label>
                     </div>
                  </div>

                  <div class="contact__box contact__area">
                     <textarea name="user_message" id="message" 
                     required placeholder="Hi Gengmeng,&#10;&#10;I’d love to connect about...&#10;Or maybe I just wanted to say hi and share a laugh. :)&#10;&#10;Best,&#10;Your name" class="contact__input"></textarea>
                     <label for="message" class="contact__label">Message <span class="contact__required-mark" aria-hidden="true">*</span></label>
                  </div>

                  <p class="contact__message" id="contact-message" role="status" aria-live="polite"></p>

                  <button type="submit" class="contact__send button">Send</button>
               </form>
            </div>
         </section>
      </main>

      <footer class="footer">

                  </li>
                  <li>
                     <a href="work.html" class="footer__link">Work</a>
                  </li>
                  <li>
                     <a href="contact.html" class="footer__link">Contact</a>
                  </li>
               </ul>
               <div class="footer__social">
                  <a href="https://www.linkedin.com/in/gengmengye/" 
                  target="_blank"
                  class="footer__social-link"
                  aria-label="Gengmeng's Linkedin">
                     <i class="ri-linkedin-box-fill"></i>
                  </a>

                  <a href="https://github.com/gengmeng-ye/" 
                  target="_blank"
                  class="footer__social-link"
                  aria-label="Gengmeng's Github profile">
                     <i class="ri-github-fill"></i>
                  </a>
               </div>

                  &#169; All Rights Reserved By Bedimcode

            </div>
